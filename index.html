<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行于迷域</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '行于迷域',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: '搜索文章…', noData: '没有找到结果' }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <audio id="bgm" src="/music/bgm.mp3" loop preload="auto" muted></audio>
  <button id="play-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 999; padding: 10px 15px; border-radius: 5px; cursor: pointer; background: #fff; border: 1px solid #ccc;">
  ▶ 播放背景音乐
  </button>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const bgm = document.getElementById('bgm');
    const playBtn = document.getElementById('play-btn');
    playBtn.addEventListener('click', function() {
      bgm.muted = false;
      bgm.volume = 0.3; // 设置音量（0.0 到 1.0）
      bgm.play().then(() => {
        playBtn.style.display = 'none';
      }).catch(error => {
        console.error("播放失败:", error);
      });
    });
  });
</script>
</body>
</html>
