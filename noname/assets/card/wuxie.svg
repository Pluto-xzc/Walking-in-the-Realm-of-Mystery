<svg xmlns="http://www.w3.org/2000/svg" width="186" height="264" viewBox="0 0 186 264">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6bab" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8b6bab" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b6bab" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b6bab" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b6bab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 牌面 -->
  <rect x="0" y="0" width="186" height="264" rx="12" fill="url(#paper)"/>
  <rect x="0" y="0" width="186" height="264" rx="12" fill="url(#glow)"/>
  <rect x="3" y="3" width="180" height="258" rx="10"
        fill="none" stroke="#c9b99a" stroke-width="1.5"/>
  <rect x="8" y="8" width="170" height="248" rx="8"
        fill="none" stroke="#8b6bab" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- 顶部类型条 -->
  <rect x="8" y="8" width="170" height="6" rx="3" fill="url(#bar)"/>

  <!-- 中央大字 -->
  <text x="93" y="138" text-anchor="middle" dominant-baseline="middle"
        font-family="KaiTi, STKaiti, 'Kaiti SC', serif" font-size="84"
        font-weight="700" fill="#2b241d" opacity="0.92">无懈</text>

  

  

  <!-- 底部装饰 -->
  <rect x="8" y="240" width="170" height="3" rx="1.5"
        fill="url(#bar)" opacity="0.7"/>

  <!-- 角标 -->
  <circle cx="26" cy="218" r="3.2" fill="#8b6bab" opacity="0.6"/>
  <circle cx="160" cy="218" r="3.2" fill="#8b6bab" opacity="0.6"/>
</svg>